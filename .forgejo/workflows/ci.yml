name: CI

# Forgejo Actions pipeline (replaces the root Jenkinsfile). Runs the test suite,
# a Trivy scan, and builds + publishes the docs image to the git.ucc.dev package
# registry. The @unchainedshop/* npm packages are published separately and are
# NOT handled here. See .forgejo/MIGRATION.md.
#
# Shared conventions across the unchained app repos (kept consistent on purpose):
#   - checkout:  actions/checkout@v4 in every job
#   - trivy:     digest-pinned docker://ghcr.io/aquasecurity/trivy step
#   - build:     docker/* actions + buildx (login/metadata/build-push)
#   - auth:      vars.REGISTRY_USER || github.actor + secrets.PKG_PUSH_TOKEN

on:
  push:
    branches: [master, develop]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: git.ucc.dev
  REGISTRY_REPO: unchained/unchained

jobs:
  test:
    name: Lint + tests
    runs-on: docker
    container: node:25-bookworm
    env:
      NODE_ENV: test
      NODE_NO_WARNINGS: '1'
      MONGOMS_VERSION: 8.2.3
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  # Source-dependency scan across the monorepo. Hard-gates on fixable HIGH/CRITICAL
  # (ADR-003). Runs the pinned Trivy image as a docker:// step so the job stays on
  # the Node-capable default runner.
  trivy:
    name: Trivy vuln gate
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs (fixable HIGH/CRITICAL gate)
        uses: docker://ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        with:
          args: fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --no-progress --disable-telemetry .

  docs:
    name: Build docs
    runs-on: docker
    needs: [test, trivy]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.PKG_PUSH_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/docs
          # Jenkins docs tagging: <branch>-latest always; next@develop; latest@master;
          # stable@tag.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=next,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docs
          file: ./docs/Dockerfile
          push: true
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/docs:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/docs:buildcache,mode=max,ignore-error=true
