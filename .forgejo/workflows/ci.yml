name: CI

# Forgejo Actions pipeline (replaces the root Jenkinsfile).
# Runs the mongo-backed lint/test suite and builds + publishes the `docs` image
# to the git.ucc.dev package registry, gated by a Trivy scan. The admin-ui image
# has its own workflow (admin-ui.yml). The @unchainedshop/* npm packages are
# published separately and are NOT handled here (they weren't in Jenkins either).
# See MIGRATION.md for repo/secret setup and the GitHub push-mirror (phase 2).

on:
  push:
    branches: [master, develop, 'v*.x', 'v*.*.x']
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: git.ucc.dev
  REGISTRY_REPO: unchained/unchained

jobs:
  # Faithful port of the Jenkins Test stage: build the mongo-based CI image
  # (root Dockerfile: mongo:8.2.12 + Node via nvm + MONGOMS_SYSTEM_BINARY, runs
  # `npm ci` + `npm run build`), then lint (gate) and test (non-blocking, exactly
  # as Jenkins ran `npm run test || :`). Uses the host docker daemon (docker.sock).
  test:
    name: Lint + tests (mongo-backed)
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Seed test dotenv
        # Replaces the Jenkins `unchained-dotenv` credential copied to ./env.
        # Pass via env (not inline ${{ }}) so dotenv metacharacters ($, ", `) are
        # never re-parsed by the shell.
        env:
          TESTS_DOTENV: ${{ secrets.TESTS_DOTENV }}
        run: printf '%s' "$TESTS_DOTENV" > ./env
      - name: Build CI image
        run: docker build -t unchained-ci:${{ github.sha }} .
      - name: Lint
        run: docker run --rm unchained-ci:${{ github.sha }} npm run lint
      - name: Tests (non-blocking, as in Jenkins)
        run: docker run --rm unchained-ci:${{ github.sha }} sh -c "npm run test || :"

  # Source-dependency scan across the whole monorepo (incl. admin-ui).
  # Hard-gates on fixable HIGH/CRITICAL (ADR-003).
  trivy:
    name: Trivy vuln gate
    runs-on: docker
    # NB: no job-level `container:` here. The trivy image ships no Node, so Forgejo
    # cannot run JS actions (checkout/cache exec `node` via `docker exec`) inside it
    # -> "node: executable file not found" (exit 127). Run on the host runner and
    # install a pinned, checksum-verified trivy binary in the step below instead.
    env:
      TRIVY_CACHE_DIR: /tmp/trivy-cache
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: trivydate
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: /tmp/trivy-cache
          # Date-rotating key + restore-keys: warm-start from the previous day's
          # DB, then let Trivy refresh it (and re-save under today's key) so the
          # vuln DB never freezes. A constant key would pin the DB forever.
          key: trivy-db-${{ runner.os }}-${{ steps.trivydate.outputs.d }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Install Trivy ${{ env.TRIVY_VERSION }} (pinned + checksum-verified)
        run: |
          set -eu
          dl="${RUNNER_TEMP:-/tmp}"
          curl -sfL -o "$dl/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $dl/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$dl/trivy.tar.gz" -C "$dl" trivy
          "$dl/trivy" --version
      - name: trivy fs (fixable HIGH/CRITICAL gate)
        run: |
          "${RUNNER_TEMP:-/tmp}/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --no-progress --disable-telemetry .

  docs:
    name: Build docs
    runs-on: docker
    needs: [trivy, test]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Raw docker login with the org-wide write:package PAT (secret
      # PKG_PUSH_TOKEN); the automatic Actions token cannot push packages.
      # Username = the REGISTRY_USER variable, else the pusher (the PAT owner
      # must have package-write on the org). Matches unchained-ch / infrastructure.
      - name: Log in to the Forgejo container registry
        run: echo "${{ secrets.PKG_PUSH_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ vars.REGISTRY_USER || github.actor }}" --password-stdin
      # Plain docker build + push over the host docker.sock. buildx /
      # build-push-action fails to push to the Forgejo registry
      # ("failed to push ...: unknown"), so avoid buildx here.
      - name: Build and push docs image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REGISTRY_REPO}/docs"
          # Jenkins docs tagging: sha-<short>, <branch>-latest (branch only),
          # next@develop, latest@master, stable@tag.
          TAGS="sha-${GITHUB_SHA:0:7}"
          [ "$GITHUB_REF_TYPE" = "branch" ] && TAGS="$TAGS ${GITHUB_REF_NAME}-latest" || true
          case "$GITHUB_REF_NAME" in
            develop) TAGS="$TAGS next" ;;
            master)  TAGS="$TAGS latest" ;;
          esac
          [ "$GITHUB_REF_TYPE" = "tag" ] && TAGS="$TAGS stable" || true
          TAG_ARGS=""
          for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t ${IMAGE}:${t}"; done
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://git.ucc.dev/${GITHUB_REPOSITORY}" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            $TAG_ARGS -f ./docs/Dockerfile ./docs
          for t in $TAGS; do
            echo "==> Pushing ${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
