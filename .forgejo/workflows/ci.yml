name: CI

# Forgejo Actions pipeline (replaces the root Jenkinsfile). Runs the test suite,
# a Trivy scan, and builds + publishes the docs image to the git.ucc.dev package
# registry. The @unchainedshop/* npm packages are published separately and are
# NOT handled here. See .forgejo/MIGRATION.md.
#
# Trivy runs as a checksum-verified host binary; publishing uses plain Docker
# because buildx pushes fail against the Forgejo registry on the current runner.

on:
  push:
    branches: [master, develop]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: git.ucc.dev
  REGISTRY_REPO: unchained/unchained

jobs:
  test:
    name: Lint + tests
    runs-on: rootless
    container: node:26.8.2-bookworm
    env:
      NODE_ENV: test
      NODE_NO_WARNINGS: '1'
      MONGOMS_VERSION: 8.2.12
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  # Keep JS actions on the Node-capable runner; the Trivy image has no Node.
  trivy:
    name: Trivy vuln gate
    runs-on: rootless
    env:
      TRIVY_CACHE_DIR: /tmp/trivy-cache
      TRIVY_VERSION: '0.74.0'
      TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
    steps:
      - uses: actions/checkout@v4
      - id: trivydate
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivydate.outputs.d }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Install Trivy (pinned + checksum-verified)
        run: |
          set -eu
          dl="${RUNNER_TEMP:-/tmp}"
          curl -sfL -o "$dl/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $dl/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$dl/trivy.tar.gz" -C "$dl" trivy
          "$dl/trivy" --version
      - name: trivy fs (fixable HIGH/CRITICAL gate)
        run: |
          "${RUNNER_TEMP:-/tmp}/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --no-progress --disable-telemetry .

  docs:
    name: Build docs
    runs-on: rootless
    needs: [test, trivy]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.PKG_PUSH_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/docs
          # Jenkins docs tagging: <branch>-latest always; next@develop; latest@master;
          # stable@tag.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=next,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
      - name: Build and push docs image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            [ -z "$label" ] || args+=(--label "$label")
          done <<< "$IMAGE_LABELS"
          docker build --platform linux/amd64 --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            "${args[@]}" -f ./docs/Dockerfile ./docs
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
